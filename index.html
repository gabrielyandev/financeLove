<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <title>Finanças Casal | Gabriel & Sara</title>
  <meta name="description" content="App mobile-first rápido de controle financeiro para casal integrado ao Google Sheets.">
  
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="background-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Typography: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            slate: {
              850: '#151f32',
              900: '#0f172a',
              950: '#090d16',
            },
            gabriel: {
              light: '#38bdf8',
              DEFAULT: '#0284c7',
              dark: '#0369a1',
            },
            sara: {
              light: '#f472b6',
              DEFAULT: '#db2777',
              dark: '#be185d',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Safe Area insets for modern smartphones (iPhone Notch & Dynamic Island) */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    /* Hide scrollbars for clean mobile feel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Active pulse touch animation */
    .tap-scale {
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tap-scale:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-full flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- App Wrapper: Fixed max mobile width for tablet/desktop centering -->
  <div class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between px-4 py-3 min-h-screen relative pb-10">

    <!-- TOP BAR / HEADER -->
    <header class="flex items-center justify-between py-2 border-b border-slate-800/80 mb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 via-cyan-500 to-pink-500 p-0.5 shadow-lg shadow-cyan-500/20">
          <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center font-extrabold text-sm text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-400">
            G&S
          </div>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-slate-100 flex items-center gap-1.5">
            Finanças do Casal
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Sheets</span>
          </h1>
          <p class="text-[11px] text-slate-400">Gabriel & Sara • Lançamento Rápido</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Status indicator (Online/Offline) -->
        <div id="connectionBadge" class="flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-medium bg-emerald-950/60 text-emerald-400 border border-emerald-800/60" title="Status da sincronização">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="connectionText">Online</span>
        </div>

        <!-- Settings Modal Trigger -->
        <button type="button" id="btnOpenSettings" class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-200 tap-scale" aria-label="Configurações da API">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- MAIN TRANSACTION FORM -->
    <form id="transactionForm" class="flex-1 flex flex-col gap-3.5" autocomplete="off">
      
      <!-- 1. VALOR EM DESTAQUE (CARD PRINCIPAL) -->
      <div class="bg-gradient-to-b from-slate-900/90 to-slate-900/40 rounded-2xl p-3.5 border border-slate-800 shadow-xl relative overflow-hidden backdrop-blur-sm">
        <div class="flex items-center justify-between text-xs text-slate-400 font-medium mb-1">
          <label for="displayAmount" class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            VALOR DO GASTO
          </label>
          <!-- Date Quick Selector (Default: Hoje) -->
          <div class="flex items-center gap-1 bg-slate-950/80 px-2 py-0.5 rounded-lg border border-slate-800 text-[11px] text-slate-300">
            <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <input type="date" id="expenseDate" class="bg-transparent text-slate-300 focus:outline-none cursor-pointer text-xs" />
          </div>
        </div>

        <!-- Big Numeric Input with R$ prefix -->
        <div class="flex items-center justify-center gap-1.5 py-2">
          <span class="text-2xl font-bold font-mono text-emerald-500/80">R$</span>
          <input 
            type="text" 
            id="displayAmount" 
            inputmode="numeric" 
            placeholder="0,00" 
            autofocus 
            required
            class="bg-transparent text-3xl sm:text-4xl font-extrabold font-mono text-emerald-400 text-left focus:outline-none tracking-tight w-full max-w-[240px] placeholder-slate-600 caret-emerald-400"
          />
          <button type="button" id="btnClearAmount" class="text-slate-500 hover:text-slate-300 text-xs px-2 py-1 rounded bg-slate-800/80 hidden" aria-label="Limpar valor">✕</button>
        </div>

        <!-- Quick increment buttons for speed -->
        <div class="flex items-center justify-center gap-1.5 pt-1.5 border-t border-slate-800/60">
          <button type="button" data-add="10" class="btn-quick-add px-2.5 py-1 text-xs font-mono font-medium rounded-lg bg-slate-800/70 text-slate-300 hover:bg-slate-700/80 tap-scale border border-slate-700/40">+10</button>
          <button type="button" data-add="20" class="btn-quick-add px-2.5 py-1 text-xs font-mono font-medium rounded-lg bg-slate-800/70 text-slate-300 hover:bg-slate-700/80 tap-scale border border-slate-700/40">+20</button>
          <button type="button" data-add="50" class="btn-quick-add px-2.5 py-1 text-xs font-mono font-medium rounded-lg bg-slate-800/70 text-slate-300 hover:bg-slate-700/80 tap-scale border border-slate-700/40">+50</button>
          <button type="button" data-add="100" class="btn-quick-add px-2.5 py-1 text-xs font-mono font-medium rounded-lg bg-slate-800/70 text-slate-300 hover:bg-slate-700/80 tap-scale border border-slate-700/40">+100</button>
        </div>
      </div>

      <!-- 2. QUEM PAGOU? (SEGMENTED BUTTON COM IDENTIDADE VISUAL) -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Quem Pagou?</label>
        <div class="grid grid-cols-2 gap-2 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
          <label class="relative flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg cursor-pointer tap-scale transition-all" id="labelGabriel">
            <input type="radio" name="quemPagou" value="Gabriel" class="sr-only" checked>
            <span class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold text-xs border border-cyan-500/30">G</span>
            <span class="text-sm font-semibold text-slate-200">Gabriel</span>
          </label>

          <label class="relative flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg cursor-pointer tap-scale transition-all" id="labelSara">
            <input type="radio" name="quemPagou" value="Sara" class="sr-only">
            <span class="w-6 h-6 rounded-full bg-pink-500/20 text-pink-400 flex items-center justify-center font-bold text-xs border border-pink-500/30">S</span>
            <span class="text-sm font-semibold text-slate-200">Sara</span>
          </label>
        </div>
      </div>

      <!-- 3. TIPO DO GASTO (CONJUNTO VS INDIVIDUAL) -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Divisão do Gasto</label>
        <div class="grid grid-cols-2 gap-2 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
          <label class="relative flex items-center justify-center gap-1.5 py-2 px-2 rounded-lg cursor-pointer tap-scale transition-all" id="labelConjunto">
            <input type="radio" name="tipoGasto" value="Conjunto (Casal)" class="sr-only" checked>
            <span class="text-xs font-semibold">💑 Conjunto (Casal)</span>
          </label>

          <label class="relative flex items-center justify-center gap-1.5 py-2 px-2 rounded-lg cursor-pointer tap-scale transition-all" id="labelIndividual">
            <input type="radio" name="tipoGasto" value="Individual" class="sr-only">
            <span class="text-xs font-semibold">👤 Individual</span>
          </label>
        </div>
      </div>

      <!-- 4. DESCRIÇÃO COM SUGESTÕES RÁPIDAS -->
      <div>
        <label for="descricao" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Descrição</label>
        <div class="relative">
          <input 
            type="text" 
            id="descricao" 
            placeholder="Ex.: Mercado, Combustível, Almoço..." 
            class="w-full bg-slate-900/90 border border-slate-800 focus:border-cyan-500 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-colors"
          />
        </div>

        <!-- Quick description chips -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1.5 mt-0.5">
          <button type="button" class="chip-desc text-[11px] px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 whitespace-nowrap tap-scale">Mercado</button>
          <button type="button" class="chip-desc text-[11px] px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 whitespace-nowrap tap-scale">Restaurante</button>
          <button type="button" class="chip-desc text-[11px] px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 whitespace-nowrap tap-scale">Gasolina</button>
          <button type="button" class="chip-desc text-[11px] px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 whitespace-nowrap tap-scale">Farmácia</button>
          <button type="button" class="chip-desc text-[11px] px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 whitespace-nowrap tap-scale">Delivery</button>
          <button type="button" class="chip-desc text-[11px] px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 whitespace-nowrap tap-scale">Uber</button>
        </div>
      </div>

      <!-- 5. GRADE DE CATEGORIAS COM ÍCONES -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Categoria</label>
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2" id="categoriesGrid">
          
          <button type="button" data-category="Mercado" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">🛒</span>
            <span class="text-[11px] font-medium text-slate-300">Mercado</span>
          </button>

          <button type="button" data-category="Alimentação" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">🍕</span>
            <span class="text-[11px] font-medium text-slate-300">Alimentação</span>
          </button>

          <button type="button" data-category="Transporte" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">🚗</span>
            <span class="text-[11px] font-medium text-slate-300">Transporte</span>
          </button>

          <button type="button" data-category="Moradia" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">🏠</span>
            <span class="text-[11px] font-medium text-slate-300">Moradia</span>
          </button>

          <button type="button" data-category="Lazer" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">🎉</span>
            <span class="text-[11px] font-medium text-slate-300">Lazer</span>
          </button>

          <button type="button" data-category="Saúde" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">💊</span>
            <span class="text-[11px] font-medium text-slate-300">Saúde</span>
          </button>

          <button type="button" data-category="Pet" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">🐾</span>
            <span class="text-[11px] font-medium text-slate-300">Pet</span>
          </button>

          <button type="button" data-category="Compras" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">🛍️</span>
            <span class="text-[11px] font-medium text-slate-300">Compras</span>
          </button>

          <button type="button" data-category="Investimentos" class="category-card flex flex-col items-center justify-center p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 tap-scale transition-all">
            <span class="text-xl mb-0.5">📈</span>
            <span class="text-[11px] font-medium text-slate-300">Investimento</span>
          </button>

        </div>
        <input type="hidden" id="categoriaInput" name="categoria" value="Mercado" />
      </div>

      <!-- 6. FORMA DE PAGAMENTO -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Forma de Pagamento</label>
        <div class="grid grid-cols-4 gap-1.5" id="paymentMethodsGrid">
          <button type="button" data-payment="Crédito" class="payment-btn py-2 px-1 text-center rounded-xl bg-slate-900 border border-slate-800 text-xs font-medium text-slate-300 hover:border-slate-700 tap-scale">
            💳 Crédito
          </button>
          <button type="button" data-payment="Pix" class="payment-btn py-2 px-1 text-center rounded-xl bg-slate-900 border border-slate-800 text-xs font-medium text-slate-300 hover:border-slate-700 tap-scale">
            ⚡ Pix
          </button>
          <button type="button" data-payment="Débito" class="payment-btn py-2 px-1 text-center rounded-xl bg-slate-900 border border-slate-800 text-xs font-medium text-slate-300 hover:border-slate-700 tap-scale">
            💳 Débito
          </button>
          <button type="button" data-payment="Dinheiro" class="payment-btn py-2 px-1 text-center rounded-xl bg-slate-900 border border-slate-800 text-xs font-medium text-slate-300 hover:border-slate-700 tap-scale">
            💵 Dinheiro
          </button>
        </div>
        <input type="hidden" id="formaPagamentoInput" name="formaPagamento" value="Crédito" />
      </div>

      <!-- SUBMIT BUTTON -->
      <div class="pt-2">
        <button 
          type="submit" 
          id="btnSubmit" 
          class="w-full py-3.5 px-4 rounded-xl font-bold text-base bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
        >
          <svg id="submitIcon" class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
          </svg>
          <span id="submitText">Salvar Despesa</span>
        </button>
      </div>

    </form>

    <!-- RECENT TRANSACTIONS / HISTÓRICO RÁPIDO -->
    <section class="mt-4 pt-3 border-t border-slate-800/80">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <span>Últimos Lançamentos</span>
          <span id="badgeTodayCount" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-800 text-slate-300">0 hoje</span>
        </h2>
        <span id="totalTodayText" class="text-xs font-mono font-bold text-emerald-400">Total: R$ 0,00</span>
      </div>

      <!-- List Container -->
      <div id="recentTransactionsList" class="space-y-1.5 max-h-44 overflow-y-auto pr-1 text-xs">
        <p class="text-slate-500 text-center py-3 text-xs italic">Nenhum gasto registrado hoje ainda.</p>
      </div>
    </section>

    <!-- TOAST NOTIFICATION BADGE -->
    <div id="toastNotification" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 opacity-0 pointer-events-none translate-y-4 max-w-xs w-full px-4">
      <div id="toastContent" class="bg-emerald-500 text-slate-950 font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center justify-center gap-2 border border-emerald-400 text-sm">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">Salvo na Planilha!</span>
      </div>
    </div>

    <!-- SETTINGS MODAL (URL DO GOOGLE APPS SCRIPT) -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl">
        <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2.5">
          <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
            ⚙️ Configurações
          </h3>
          <button type="button" id="btnCloseSettings" class="text-slate-400 hover:text-slate-200 text-sm p-1">✕</button>
        </div>

        <div class="space-y-3.5 text-xs">
          <div>
            <label for="inputApiUrl" class="block font-semibold text-slate-300 mb-1">URL do Google Apps Script (Web App):</label>
            <input 
              type="url" 
              id="inputApiUrl" 
              placeholder="https://script.google.com/macros/s/.../exec" 
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-cyan-500"
            />
            <p class="text-[11px] text-slate-500 mt-1">Cole a URL gerada na opção "Implantar como App da Web" do Apps Script.</p>
          </div>

          <!-- Connection test result -->
          <div id="testResult" class="hidden p-2 rounded-lg text-xs"></div>

          <div class="flex items-center gap-2 pt-2">
            <button type="button" id="btnTestConnection" class="flex-1 py-2 px-3 rounded-xl bg-slate-800 text-slate-200 font-medium hover:bg-slate-700 transition">
              Testar Conexão
            </button>
            <button type="button" id="btnSaveSettings" class="flex-1 py-2 px-3 rounded-xl bg-cyan-600 text-white font-semibold hover:bg-cyan-500 transition">
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Main Application Script -->
  <script src="app.js"></script>
</body>
</html>
